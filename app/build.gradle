plugins {
    id 'com.android.application'
}
// Release signing never falls back to the disposable GitHub Actions debug key.
def releaseStore = System.getenv('WONHEE_SIGNING_STORE_FILE')
def releaseStorePassword = System.getenv('WONHEE_SIGNING_STORE_PASSWORD')
def releaseAlias = System.getenv('WONHEE_SIGNING_KEY_ALIAS')
def releaseKeyPassword = System.getenv('WONHEE_SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

android {
    signingConfigs {
        wonheeRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.wonheeRelease
            }
        }
    }
    namespace 'com.yooshastan.wonheeproxy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yooshastan.wonheeproxy'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.8.6-alpha08.6.1-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
