plugins {
    id 'com.android.application'
}
// Release signing never falls back to the disposable GitHub Actions debug key.
def releaseStore = System.getenv('WONHEE_SIGNING_STORE_FILE')
def releaseStorePassword = System.getenv('WONHEE_SIGNING_STORE_PASSWORD')
def releaseAlias = System.getenv('WONHEE_SIGNING_KEY_ALIAS')
def releaseKeyPassword = System.getenv('WONHEE_SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

android {
    signingConfigs {
        wonheeRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Side-by-side experiment; never replace the user's signed stable app.
            applicationIdSuffix '.rootlab01562triple1native160'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.wonheeRelease
            }
        }
    }
    namespace 'com.yooshastan.wonheeproxy'
    compileSdk 36
    sourceSets {
        debug { jniLibs.srcDir "$buildDir/generated/wonheeNativeJniLibs" }
    }

    defaultConfig {
        applicationId 'com.yooshastan.wonheeproxy'
        minSdk 26
        targetSdk 35
        versionCode 108
        versionName '0.15.61-connection-setup'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

// The native socket bridge and scoped TUN ingress diagnostic are debug-only.
// The official signed release stays at 0.15.61/versionCode 108 until
// real multi-exit fail-closed operation passes device acceptance.
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.forEach { output ->
            output.versionCode.set(163)
            output.versionName.set('0.25.1-dns-isolation')
        }
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}

// Build the Android-only JNI bridge before packaging the debug variant.
def wonheeNativeOutput = layout.buildDirectory.dir('generated/wonheeNativeJniLibs')
tasks.register('buildWonheeNativeAndroidArm64', Exec) {
    inputs.files(fileTree("$rootDir/native"))
    inputs.file("$rootDir/scripts/build-wonhee-native-android.sh")
    outputs.file(layout.buildDirectory.file('generated/wonheeNativeJniLibs/arm64-v8a/libwonhee_native.so'))
    commandLine 'bash', "$rootDir/scripts/build-wonhee-native-android.sh", wonheeNativeOutput.get().asFile.absolutePath
}
tasks.matching { it.name == 'mergeDebugJniLibFolders' }.configureEach {
    dependsOn tasks.named('buildWonheeNativeAndroidArm64')
}
