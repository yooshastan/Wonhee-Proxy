name: Wonhee Android CI · Debug Build and Guarded Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify and compile strict root-bound encrypted DNS helper
        run: |
          bash -n scripts/build-root-doh-helper.sh
          bash scripts/build-root-doh-helper.sh
          if [[ -n "$(git status --porcelain -- roothelper/dohprobe/go.mod roothelper/dohprobe/go.sum)" ]]; then
            echo "DNS helper build changed tracked or untracked module metadata." >&2
            exit 1
          fi
      - name: Verify everyday Home entry points
        run: python3 scripts/test-wonhee-home-entrypoints.py
      - name: Verify App Routing draft privacy and safety contract
        run: python3 scripts/test-wonhee-app-routing.py
      - name: Verify debug-only 0.26.0 RootLab APK and read-only readiness screen
        run: python3 scripts/test-wonhee-rootlab-preview.py
      - name: Verify secure endpoint DNS wire codec
        run: |
          mkdir -p /tmp/wonhee-dns-codec
          javac -d /tmp/wonhee-dns-codec app/src/debug/java/com/yooshastan/wonheeproxy/NativeEndpointDnsMessage.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeBootstrapHttp.java core-tests/NativeEndpointDnsMessageTest.java core-tests/NativeBootstrapHttpTest.java
          java -cp /tmp/wonhee-dns-codec com.yooshastan.wonheeproxy.NativeEndpointDnsMessageTest
          java -cp /tmp/wonhee-dns-codec com.yooshastan.wonheeproxy.NativeBootstrapHttpTest
      - name: Verify bounded sustained transfer framing
        run: |
          mkdir -p /tmp/wonhee-transfer
          javac -d /tmp/wonhee-transfer app/src/debug/java/com/yooshastan/wonheeproxy/NativeTransferBody.java core-tests/NativeTransferBodyTest.java
          java -cp /tmp/wonhee-transfer com.yooshastan.wonheeproxy.NativeTransferBodyTest
      - name: Verify physical network preference and debounce
        run: |
          mkdir -p /tmp/wonhee-underlay
          javac -d /tmp/wonhee-underlay app/src/debug/java/com/yooshastan/wonheeproxy/NativeUnderlayPolicy.java core-tests/NativeUnderlayPolicyTest.java
          java -cp /tmp/wonhee-underlay com.yooshastan.wonheeproxy.NativeUnderlayPolicyTest
      - name: Verify bounded recovery retry schedule
        run: |
          mkdir -p /tmp/wonhee-recovery
          javac -d /tmp/wonhee-recovery app/src/debug/java/com/yooshastan/wonheeproxy/NativeRecoveryPlan.java core-tests/NativeRecoveryPlanTest.java
          java -cp /tmp/wonhee-recovery com.yooshastan.wonheeproxy.NativeRecoveryPlanTest
      - name: Verify encrypted DNS provider and transport matrix
        run: |
          mkdir -p /tmp/wonhee-dns-mode
          javac -d /tmp/wonhee-dns-mode app/src/debug/java/com/yooshastan/wonheeproxy/NativeDnsTransportPolicy.java core-tests/NativeDnsTransportPolicyTest.java
          java -cp /tmp/wonhee-dns-mode com.yooshastan.wonheeproxy.NativeDnsTransportPolicyTest
          javac -d /tmp/wonhee-dns-backoff app/src/debug/java/com/yooshastan/wonheeproxy/NativeDnsFreshBackoff.java core-tests/NativeDnsFreshBackoffTest.java
          java -cp /tmp/wonhee-dns-backoff com.yooshastan.wonheeproxy.NativeDnsFreshBackoffTest
      - name: Verify bounded DNS cache and TTL aging
        run: |
          mkdir -p /tmp/wonhee-dns-cache
          javac -d /tmp/wonhee-dns-cache app/src/debug/java/com/yooshastan/wonheeproxy/NativeProtectedDnsMessage.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeDnsPositiveCache.java core-tests/NativeDnsPositiveCacheTest.java
          java -cp /tmp/wonhee-dns-cache com.yooshastan.wonheeproxy.NativeDnsPositiveCacheTest
      - name: Verify protected DNS packet framing and hosts matching
        run: |
          mkdir -p /tmp/wonhee-protected-dns
          javac -d /tmp/wonhee-protected-dns app/src/debug/java/com/yooshastan/wonheeproxy/NativeProtectedDnsMessage.java core-tests/NativeProtectedDnsMessageTest.java
          java -cp /tmp/wonhee-protected-dns com.yooshastan.wonheeproxy.NativeProtectedDnsMessageTest
      - name: Verify Home route suggestions and live traffic metrics
        run: |
          mkdir -p /tmp/wonhee-ui-models
          javac -d /tmp/wonhee-ui-models app/src/main/java/com/yooshastan/wonheeproxy/AppUseCategories.java app/src/main/java/com/yooshastan/wonheeproxy/MultiTunnelIpv4Rewriter.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeAppRoutingPolicy.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeHomeRoutes.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeRoutingMetrics.java core-tests/NativeRoutingUiModelsTest.java
          java -cp /tmp/wonhee-ui-models com.yooshastan.wonheeproxy.NativeRoutingUiModelsTest
      - name: Verify selected-app policy and flow ownership
        run: |
          mkdir -p /tmp/wonhee-app-routing
          javac -d /tmp/wonhee-app-routing app/src/main/java/com/yooshastan/wonheeproxy/AppUseCategories.java app/src/main/java/com/yooshastan/wonheeproxy/MultiTunnelIpv4Rewriter.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeAppRoutingPolicy.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeAppCategorySuggestions.java core-tests/NativeAppRoutingPolicyTest.java core-tests/NativeAppCategorySuggestionsTest.java
          java -cp /tmp/wonhee-app-routing com.yooshastan.wonheeproxy.NativeAppRoutingPolicyTest
          java -cp /tmp/wonhee-app-routing com.yooshastan.wonheeproxy.NativeAppCategorySuggestionsTest
      - name: Verify bounded startup retries and route isolation safety
        run: |
          mkdir -p /tmp/wonhee-routing-safety
          javac -d /tmp/wonhee-routing-safety app/src/debug/java/com/yooshastan/wonheeproxy/NativeRoutingSafety.java core-tests/NativeRoutingSafetyTest.java
          java -cp /tmp/wonhee-routing-safety com.yooshastan.wonheeproxy.NativeRoutingSafetyTest
      - name: Verify opt-in egress guard plan and exact rollback transaction
        run: |
          mkdir -p /tmp/wonhee-egress
          javac -d /tmp/wonhee-egress app/src/main/java/com/yooshastan/wonheeproxy/RootTcpProbeTarget.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeEgressGuardPlan.java app/src/debug/java/com/yooshastan/wonheeproxy/NativeEgressGuardRuntime.java core-tests/NativeEgressGuardPlanTest.java core-tests/NativeEgressGuardRuntimeTest.java
          java -cp /tmp/wonhee-egress com.yooshastan.wonheeproxy.NativeEgressGuardPlanTest
          java -cp /tmp/wonhee-egress com.yooshastan.wonheeproxy.NativeEgressGuardRuntimeTest
      - name: Verify native Android JNI and scoped TUN ingress contract
        run: python3 scripts/test-wonhee-native-bridge-contract.py
      - name: Test fail-closed synthetic TUN packet classification
        run: |
          mkdir -p /tmp/wonhee-tun-policy
          javac -d /tmp/wonhee-tun-policy \
            app/src/debug/java/com/yooshastan/wonheeproxy/RootlessTunTestPacketRouter.java \
            core-tests/RootlessTunTestPacketRouterTest.java
          java -cp /tmp/wonhee-tun-policy com.yooshastan.wonheeproxy.RootlessTunTestPacketRouterTest
      - name: Verify permanent release-signing setup script syntax
        run: bash -n scripts/setup-wonhee-release-signing.sh scripts/build-wonhee-official-local.sh scripts/install-wonhee-safe-update.sh scripts/wonhee-01562-device-preflight.sh
      - name: Prove safe installer refuses unsafe live/root states
        run: |
          bash -n scripts/test-wonhee-safe-update.sh
          bash scripts/test-wonhee-safe-update.sh
      - name: Test opt-in 0.15.28 ledger rescue refusal and exact padding
        run: |
          python3 -m py_compile scripts/wonhee-01528-ledger-rescue.py
          python3 scripts/test-wonhee-01528-ledger-rescue.py
      - name: Verify offline transport exception contract
        run: |
          mkdir -p /tmp/wonhee-transport
          javac -d /tmp/wonhee-transport \
            app/src/main/java/com/yooshastan/wonheeproxy/RootFirewallMark.java \
            app/src/main/java/com/yooshastan/wonheeproxy/RootTcpProbeTarget.java \
            app/src/main/java/com/yooshastan/wonheeproxy/RootMokaHomeFirewallPilotPlan.java \
            app/src/main/java/com/yooshastan/wonheeproxy/RootTransportGuardPlan.java \
            core-tests/RootTransportGuardPlanTest.java
          java -cp /tmp/wonhee-transport com.yooshastan.wonheeproxy.RootTransportGuardPlanTest
      - name: Verify transport ownership and rollback lifecycle
        run: |
          mkdir -p /tmp/wonhee-transport-lifecycle
          javac -d /tmp/wonhee-transport-lifecycle \
            app/src/main/java/com/yooshastan/wonheeproxy/RootTransportGuardLifecycle.java \
            core-tests/RootTransportGuardLifecycleTest.java
          java -cp /tmp/wonhee-transport-lifecycle com.yooshastan.wonheeproxy.RootTransportGuardLifecycleTest
