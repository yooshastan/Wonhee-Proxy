      - uses: actions/upload-artifact@v4
        with:
          name: wonhee-01514-f2-manual-health-diagnostic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    # Explicit maintainer-only dispatch. Never expose release keys to PR builds.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'yooshastan/Wonhee-Proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify and compile strict root-bound encrypted DNS helper
        run: bash scripts/build-root-doh-helper.sh
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Restore persistent release keystore
        env:
          SIGNING_B64: ${{ secrets.WONHEE_SIGNING_STORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WONHEE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WONHEE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WONHEE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing release signing secrets. See docs/SIGNING.md." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/wonhee-release.jks"
          echo "WONHEE_SIGNING_STORE_FILE=$RUNNER_TEMP/wonhee-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          WONHEE_SIGNING_STORE_PASSWORD: ${{ secrets.WONHEE_SIGNING_STORE_PASSWORD }}
          WONHEE_SIGNING_KEY_ALIAS: ${{ secrets.WONHEE_SIGNING_KEY_ALIAS }}
          WONHEE_SIGNING_KEY_PASSWORD: ${{ secrets.WONHEE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify pinned release signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.WONHEE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_CERT_SHA256:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Set WONHEE_SIGNING_CERT_SHA256 to the 64-character public cert fingerprint. See docs/SIGNING.md." >&2
            exit 1
          fi
          apk="app/build/outputs/apk/release/app-release.apk"
          output="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")"
          actual="$(printf '%s\n' "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          actual="${actual//:/}"
          actual="${actual//[[:space:]]/}"
          if [[ ! "$actual" =~ ^[[:xdigit:]]{64}$ || "${actual,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo "Signing fingerprint mismatch or missing signature. Refusing to publish APK." >&2
            exit 1
          fi
          sha256sum "$apk" > app/build/outputs/apk/release/wonhee-sha256.txt
          echo "Signed APK certificate pinned and verified. APK checksum written." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: wonhee-proxy-alpha092-preview-signed-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/wonhee-sha256.txt
          if-no-files-found: error
          retention-days: 14
