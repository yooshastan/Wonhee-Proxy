name: Wonhee Proxy Android Alpha 0.8.7 Preview

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run standalone proxy core tests
        run: |
          mkdir -p /tmp/wonhee-classes
          javac -d /tmp/wonhee-classes \
            app/src/main/java/com/yooshastan/wonheeproxy/core/ProxyEndpoint.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/ProxyProbe.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/UltgramPackages.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/EndpointSelector.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/ProbeHistory.java \
            app/src/main/java/com/yooshastan/wonheeproxy/VpnDnsPresets.java \
            app/src/main/java/com/yooshastan/wonheeproxy/VpnHealthSummary.java \
            app/src/main/java/com/yooshastan/wonheeproxy/TunnelTrafficRates.java \
            app/src/main/java/com/yooshastan/wonheeproxy/TunnelTrafficHistory.java \
            app/src/main/java/com/yooshastan/wonheeproxy/VpnRouteInspection.java \
            app/src/main/java/com/yooshastan/wonheeproxy/TunnelEventHistory.java \
            core-tests/ProxyEndpointTest.java \
            core-tests/ProxyProbeTest.java \
            core-tests/UltgramPackagesTest.java \
            core-tests/EndpointSelectorTest.java \
            core-tests/ProbeHistoryTest.java \
            core-tests/VpnDnsPresetsTest.java \
            core-tests/VpnHealthSummaryTest.java \
            core-tests/TunnelTrafficRatesTest.java \
            core-tests/TunnelTrafficHistoryTest.java \
            core-tests/VpnRouteInspectionTest.java \
            core-tests/TunnelEventHistoryTest.java
          java -cp /tmp/wonhee-classes ProxyEndpointTest
          java -cp /tmp/wonhee-classes ProxyProbeTest
          java -cp /tmp/wonhee-classes UltgramPackagesTest
          java -cp /tmp/wonhee-classes EndpointSelectorTest
          java -cp /tmp/wonhee-classes ProbeHistoryTest
          java -cp /tmp/wonhee-classes com.yooshastan.wonheeproxy.VpnDnsPresetsTest
          java -cp /tmp/wonhee-classes com.yooshastan.wonheeproxy.VpnHealthSummaryTest
          java -cp /tmp/wonhee-classes com.yooshastan.wonheeproxy.TunnelTrafficRatesTest
          java -cp /tmp/wonhee-classes com.yooshastan.wonheeproxy.TunnelTrafficHistoryTest
          java -cp /tmp/wonhee-classes com.yooshastan.wonheeproxy.VpnRouteInspectionTest
          java -cp /tmp/wonhee-classes com.yooshastan.wonheeproxy.TunnelEventHistoryTest
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: wonhee-proxy-alpha08.7-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    # Explicit maintainer-only dispatch. Never expose release keys to PR builds.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Restore persistent release keystore
        env:
          SIGNING_B64: ${{ secrets.WONHEE_SIGNING_STORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WONHEE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WONHEE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WONHEE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing release signing secrets. See docs/SIGNING.md." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/wonhee-release.jks"
          echo "WONHEE_SIGNING_STORE_FILE=$RUNNER_TEMP/wonhee-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          WONHEE_SIGNING_STORE_PASSWORD: ${{ secrets.WONHEE_SIGNING_STORE_PASSWORD }}
          WONHEE_SIGNING_KEY_ALIAS: ${{ secrets.WONHEE_SIGNING_KEY_ALIAS }}
          WONHEE_SIGNING_KEY_PASSWORD: ${{ secrets.WONHEE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify pinned release signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.WONHEE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_CERT_SHA256:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Set WONHEE_SIGNING_CERT_SHA256 to the 64-character public cert fingerprint. See docs/SIGNING.md." >&2
            exit 1
          fi
          apk="app/build/outputs/apk/release/app-release.apk"
          output="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")"
          actual="$(printf '%s\n' "$output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          actual="${actual//:/}"
          actual="${actual//[[:space:]]/}"
          if [[ ! "$actual" =~ ^[[:xdigit:]]{64}$ || "${actual,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo "Signing fingerprint mismatch or missing signature. Refusing to publish APK." >&2
            exit 1
          fi
          sha256sum "$apk" > app/build/outputs/apk/release/wonhee-sha256.txt
          echo "Signed APK certificate pinned and verified. APK checksum written." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: wonhee-proxy-alpha08.7-preview-signed-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/wonhee-sha256.txt
          if-no-files-found: error
          retention-days: 14
