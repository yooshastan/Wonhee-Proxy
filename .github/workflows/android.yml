name: Wonhee Proxy Android Alpha 0.6

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run standalone proxy core tests
        run: |
          mkdir -p /tmp/wonhee-classes
          javac -d /tmp/wonhee-classes \
            app/src/main/java/com/yooshastan/wonheeproxy/core/ProxyEndpoint.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/ProxyProbe.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/UltgramPackages.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/EndpointSelector.java \
            app/src/main/java/com/yooshastan/wonheeproxy/core/ProbeHistory.java \
            core-tests/ProxyEndpointTest.java \
            core-tests/ProxyProbeTest.java \
            core-tests/UltgramPackagesTest.java \
            core-tests/EndpointSelectorTest.java \
            core-tests/ProbeHistoryTest.java
          java -cp /tmp/wonhee-classes ProxyEndpointTest
          java -cp /tmp/wonhee-classes ProxyProbeTest
          java -cp /tmp/wonhee-classes UltgramPackagesTest
          java -cp /tmp/wonhee-classes EndpointSelectorTest
          java -cp /tmp/wonhee-classes ProbeHistoryTest
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: wonhee-proxy-alpha06-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
