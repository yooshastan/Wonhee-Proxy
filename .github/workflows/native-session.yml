name: Wonhee Native Dual-WireGuard Session Experiment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-session-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'
          cache: false
      - name: Verify pinned upstream and module package
        working-directory: native
        run: |
          go mod tidy
          go mod verify
          test "$(go list -m -f '{{.Version}}' golang.zx2c4.com/wireguard)" = v0.0.0-20261024220952-b3bc704ef0ee
          test "$(go list -m -f '{{.Version}}' github.com/quic-go/quic-go)" = v0.50.0
      - name: Test independent packet bridges and crypto-device lifecycle
        working-directory: native
        run: go test -race -count=1 ./...
      - name: Cross-compile native packet engine for Android ARM64
        working-directory: native
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build ./...
